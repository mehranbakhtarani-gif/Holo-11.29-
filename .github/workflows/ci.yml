name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "fix/profile-photo-on-main"
      - "fix/phase-1-financial-core"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - name: Install dependencies
        run: npm install --no-package-lock
      - name: TypeScript check
        run: npm run lint
      - name: Firestore rules lint
        run: npm run lint:rules
      - name: Test suite
        run: npm test
      - name: Production build
        run: npm run build
